# End-to-end test stack: real n8n (same settings as the repo-root compose file) + a mock of
# every external service. Driven by run_e2e.py; not for production use.
services:
  mock:
    image: n8n-portfolio-e2e
    build: .
    entrypoint: ["python3", "/e2e/mock_api.py"]
    volumes:
      - ./:/e2e:ro
    ports:
      - "8765:8765"

  n8n:
    image: n8n-portfolio-e2e
    build: .
    depends_on: [mock]
    ports:
      - "5679:5678"
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODES_EXCLUDE=[]
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=UTC
      # workflow configuration, pointed at the mock
      - CRM_SHEET_ID=e2e-crm-sheet
      - FINANCE_SHEET_ID=e2e-finance-sheet
      - OPS_SHEET_ID=e2e-ops-sheet
      - CREATIVE_SHEET_ID=e2e-creative-sheet
      - ASSET_STORE_URL=http://mock:8765/assets
      - ASSET_STORE_TOKEN=e2e-token
      - COMFYUI_URL=http://mock:8765/comfy
      - N8N_BASE_URL=http://localhost:5678
      - ADS_API_URL=http://mock:8765/ads
      - ADS_API_TOKEN=e2e-token
      - AFFILIATE_API_URL=http://mock:8765/aff
      - AFFILIATE_API_KEY=e2e-key
      - DCO_MIN_IMPRESSIONS=1000
      - DCO_TARGET_ROAS=1.3
      - DCO_SCALE_STEP=1.2
    volumes:
      - ./.work:/work
      - ./.work/data:/data
      - ../../project-4-media-render-farm/scripts/render_variant.sh:/data/scripts/render_variant.sh:ro
      - ../../project-5-generative-creative-factory/scripts/postprocess_creative.py:/data/scripts/postprocess_creative.py:ro
      - ../../project-6-dco-engine/scripts/ab_significance.py:/data/scripts/ab_significance.py:ro
